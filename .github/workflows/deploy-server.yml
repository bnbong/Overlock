name: Deploy Server (vm2)

# docs/deploy.md §7-1 의 수동 배포를 자동화한다.
#   1) GHCR 에 커밋 SHA 태그 이미지(ghcr.io/<owner>/overlock-server:<sha> + :latest)를 빌드/푸시
#   2) vm2 에 SSH 로 접속해 docker pull → 컨테이너 교체(§7-1 과 동일한 run) → /api/health 확인
# 롤백: 아래 workflow_dispatch 의 image_tag 에 이전 커밋 SHA 를 넣어 재실행하면
#       재빌드 없이 그 이미지를 배포한다(자세한 내용은 docs/deploy.md §8).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 GHCR 이미지 태그. 비우면 현재 커밋 SHA. 롤백 시 이전 커밋 SHA 를 입력."
        required: false
        default: ""
  # --- 자동 트리거 예시 (기본 비활성) --------------------------------------
  # server/ 가 바뀔 때마다 자동 배포하려면 아래 push 블록의 주석을 해제한다.
  # push:
  #   branches: [main]
  #   paths:
  #     - "server/**"
  #     - ".github/workflows/deploy-server.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE_NAME: overlock-server

jobs:
  build-push:
    name: Build & push image (GHCR)
    # 명시적 image_tag(롤백)로 dispatch 하면 재빌드를 건너뛴다.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image ref (lowercase owner)
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
            ${{ steps.ref.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to vm2 (SSH)
    needs: build-push
    # build-push 가 성공했거나(정상 배포) 건너뛰어졌을 때(롤백) 모두 실행.
    if: ${{ always() && !cancelled() && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image ref
        id: img
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_SHA}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH (§7-1 과 동일한 run, 이미지만 GHCR 태그)
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        with:
          host: ${{ secrets.VM2_SSH_HOST }}
          username: ${{ secrets.VM2_SSH_USER }}
          key: ${{ secrets.VM2_SSH_KEY }}
          envs: IMAGE
          script_stop: true
          script: |
            set -eu
            echo "Deploying image: ${IMAGE}"
            docker pull "${IMAGE}"
            docker rm -f vm2-overlock 2>/dev/null || true
            docker run -d --name vm2-overlock --restart unless-stopped \
              -p 8010:8000 -v overlock-data:/data \
              -e OVERLOCK_TRUST_FORWARDED_FOR=true \
              -e OVERLOCK_CORS_ORIGINS=https://overlock.bnbong.com \
              "${IMAGE}"
            echo "Waiting for /api/health ..."
            ok=0
            for _ in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8010/api/health | grep -q '"status":"ok"'; then
                ok=1; break
              fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "Health check FAILED"; docker logs --tail 80 vm2-overlock || true; exit 1
            fi
            echo "Health OK: $(curl -fsS http://127.0.0.1:8010/api/health)"
