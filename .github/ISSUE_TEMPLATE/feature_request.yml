name: 기능 제안
description: 새 기능이나 개선 아이디어를 제안합니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        기능 제안 감사합니다. 어떤 문제를 해결하려는지부터 적어주시면 논의가 수월합니다.

  - type: textarea
    id: motivation
    attributes:
      label: 해결하려는 문제 / 동기
      description: 지금 어떤 불편함이나 한계가 있어서 이 제안을 하게 되었나요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 구체적으로 어떤 기능·변경을 원하는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안 검토
      description: 고려해본 다른 방법이 있다면 적어주세요.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 추가 맥락 · 목업
      description: 참고 이미지, 목업, 관련 링크 등이 있으면 첨부해주세요.
    validations:
      required: false
