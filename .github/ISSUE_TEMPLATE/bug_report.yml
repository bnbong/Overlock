name: 버그 리포트
description: 게임 플레이나 리더보드 서버에서 발견한 버그를 신고합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그 제보 감사합니다. 재현 절차가 구체적일수록 빨리 고칠 수 있습니다.

  - type: textarea
    id: summary
    attributes:
      label: 버그 요약
      description: 어떤 문제가 발생했는지 한두 문장으로 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 문제를 재현하는 단계를 순서대로 적어주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: 기대 동작 vs 실제 동작
      description: 원래 어떻게 동작해야 하는지와 실제로 어떻게 동작했는지를 함께 적어주세요.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼
      description: 어디에서 발생했나요?
      options:
        - 웹 (overlock.bnbong.com)
        - 데스크톱 빌드
        - 에디터 실행
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 브라우저·OS 버전 등 재현에 참고할 환경 정보를 적어주세요.
      placeholder: |
        예) macOS 15.1 / Chrome 128
        예) Windows 11 / 데스크톱 빌드 v0.1.0
    validations:
      required: false

  - type: dropdown
    id: track-type
    attributes:
      label: 트랙 종류
      description: 문제가 특정 트랙과 관련 있다면 어떤 종류인가요?
      options:
        - 공식 트랙
        - 커스텀 트랙
        - 트랙 에디터
        - 해당 없음
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: 스크린샷·영상
      description: 문제를 보여주는 스크린샷이나 영상이 있으면 첨부해주세요.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 추가 맥락
      description: 그 외 참고할 만한 내용이 있으면 적어주세요.
    validations:
      required: false
